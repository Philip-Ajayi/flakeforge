version: "3.8"

services:
  flakeforge:
    build: .
    container_name: flakeforge-agent
    ports:
      - "8000:8000"
    environment:
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-nvidia/llama-3.1-nemotron-70b-instruct}
      - FLAKEFORGE_PROVIDER=nvidia_nim
      - FLAKEFORGE_HOST=0.0.0.0
      - FLAKEFORGE_PORT=8000
      - FLAKEFORGE_DEBUG=False
    restart: unless-stopped